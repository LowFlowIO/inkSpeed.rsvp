; inkSpeed RSVP Reader for the Waveshare ESP32-S3-ePaper-1.54 V2
; (same hardware as kuslota/InkBoy).
;
; platform = espressif32@6.12.0 is the official PlatformIO Espressif 32
; platform. Its framework-espidf package version ~3.50500.0 is ESP-IDF 5.5.0.
; The vendored display driver was written for ESP-IDF 6.1; the APIs this
; firmware actually calls (esp_driver_gpio, esp_driver_spi, and
; spi_transaction_t.override_freq_hz) are present in ESP-IDF 5.5. This is
; not ESP-IDF 6.1 and is not claimed to be an IDF 6.1 build.
;
; The board JSON for esp32-s3-devkitc-1 says "8 MB flash, no PSRAM". The
; Waveshare V2 module is an ESP32-S3-PICO-1-N8R8 with 8 MB flash and 8 MB
; octal PSRAM. PSRAM and flash settings come from sdkconfig.defaults, which
; match InkBoy's proven DIO / 40 MHz / octal 80 MHz configuration.

[platformio]
default_envs = waveshare_esp32s3_epaper_154_v2

[env:waveshare_esp32s3_epaper_154_v2]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_size = 8MB
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
monitor_filters = direct
extra_scripts = post:tools/scons_print_cmd.py
